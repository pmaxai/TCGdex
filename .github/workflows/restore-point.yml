name: Restore point

# Freezes the current state as a permanent release: a tag on the code plus copies of
# the current APK and data pack (those two are overwritten by every new build).
# Actions -> Restore point -> Run workflow. Without a name it's named after the current
# build (v1.2.9). With "latest" it's a release: the Latest release on GitHub, and the next
# builds move to the next version line (1.2.9 -> 1.3.1, android/version.properties).

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Name, e.g. v1.2.9 (letters, digits, dots, dashes). Empty: the current build's version"
        required: false
        default: ""
      notes:
        description: "What this version is (optional)"
        default: ""
      latest:
        description: "Release: mark it as the Latest release and start the next version line (1.2.x -> 1.3.x)"
        type: boolean
        default: false

permissions:
  contents: write      # the release, and the next version line in android/version.properties
  actions: read        # the Android build's run number (where the next line starts)

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Freeze code, APK and data pack
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.name }}
          NOTES: ${{ inputs.notes }}
          LATEST: ${{ inputs.latest }}
        run: |
          if [ -z "$NAME" ]; then
            # the current build's version, from the app's update file
            gh release download app-latest -p version.json -O current-version.json
            NAME="v$(python3 -c "import json; print(json.load(open('current-version.json'))['versionName'])")"
            rm -f current-version.json
            echo "name: $NAME"
          fi
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          if ! [[ "$NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then echo "invalid name: $NAME"; exit 1; fi
          if gh release view "$NAME" >/dev/null 2>&1; then
            # an existing release is never changed, except to mark it as the shipped (Latest) one
            if [ "$LATEST" = "true" ]; then gh release edit "$NAME" --latest; gh release view "$NAME"; exit 0; fi
            echo "restore point $NAME already exists"; exit 1
          fi
          mkdir freeze
          gh release download app-latest -D freeze -p CardScanner.apk
          gh release download data-pack -D freeze
          PACK_VERSION=$(python3 -c "import json; print(json.load(open('freeze/pack.json'))['version'])")
          {
            echo "${NOTES:-Restore point.}"
            echo
            echo "- Code: commit ${GITHUB_SHA::7} (the 'Source code' downloads below, or this tag)"
            echo "- App: CardScanner.apk as it was on 'app-latest' at this point"
            echo "- Data pack: $PACK_VERSION (model.onnx, index.f16, catalog.sqlite, pack.json, parity.zip)"
            echo
            echo "To reinstall this APK over a newer one, uninstall the app first (Android blocks downgrades)."
          } > notes.md
          gh release create "$NAME" freeze/* --target "$GITHUB_SHA" --title "$NAME" --notes-file notes.md --latest="$LATEST"
          echo "CREATED=true" >> "$GITHUB_ENV"
          gh release view "$NAME"

      # a release: the next builds count on the next line (1.2.9 released -> 1.3.1, 1.3.2, ...)
      - name: Start the next version line
        if: inputs.latest && env.CREATED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=android/version.properties
          line=$(sed -n 's/^line=//p' $f | tr -d '[:space:]')
          next=$(python3 -c "m, n = '$line'.split('.'); print(f'{m}.{int(n) + 1}')")
          base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?per_page=1" -q '.workflow_runs[0].run_number')
          sed -i "s/^line=.*/line=$next/; s/^base=.*/base=$base/" $f
          sed -i "s/^# the last Android build (run number) before this line.*/# the last Android build (run number) before this line: $NAME was released at build $base/" $f
          cat $f
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --quiet origin main
          git commit -am "Version line $next (after release $NAME)"
          git push origin HEAD:main
