name: PSA data check

# Looks at the PSA prices already downloaded (no API calls, no credits):
# prints how graded sales are split by printing.
on:
  workflow_dispatch:
    inputs:
      history:
        description: "Also probe price history for one card (2 API calls)"
        type: boolean
        default: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy requests
      - name: Restore PSA price cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/graded
          key: graded-none
          restore-keys: graded-
      - name: Inspect
        working-directory: pipeline
        run: python -c "import logging,sys; logging.basicConfig(level=logging.INFO, format='%(message)s'); from tcgscan.graded import inspect; inspect('../.cache/graded')"
      - name: Does the plan include gem rates (PSA population)?
        working-directory: pipeline
        env:
          POKEMONPRICETRACKER_API_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
        run: python -m tcgscan graded --probe-population
      - name: Price history for one card (what comes back, what it costs)
        if: inputs.history
        working-directory: pipeline
        env:
          POKEMONPRICETRACKER_API_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
        run: python -m tcgscan graded --probe-history
