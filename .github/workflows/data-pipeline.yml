name: Data pipeline

# Downloads the TCGdex catalog (cards, Cardmarket/TCGplayer prices, images),
# fingerprints every card and runs the accuracy test.
# Results: the run's Summary page (report), plus "report" and "data-pack" downloads.

on:
  workflow_dispatch:
    inputs:
      langs:
        description: "Card languages (TCGdex codes, comma separated)"
        default: "en,de,ja,zh-cn,zh-tw"
      image_langs:
        description: "Languages whose card images are fingerprinted (others share artwork with English)"
        default: "en,de,ja,zh-cn,zh-tw"
      models:
        description: "Fingerprint models (phash, phash_art, mnv3, mnv3_art, dinov2s, dinov2s_art)"
        default: "phash,mnv3_art"
      queries:
        description: "Number of synthetic test photos"
        default: "1500"
      max_sets:
        description: "0 = all sets; e.g. 15 = quick run on 15 sets"
        default: "0"
      prices:
        description: "Fetch prices (one request per card, cached for 20 h)"
        type: boolean
        default: true
      psa:
        description: "Fetch PSA 10/9/8 prices (PokemonPriceTracker, needs the POKEMONPRICETRACKER_API_KEY secret)"
        type: boolean
        default: true
  # fresh prices every morning (a new APK follows automatically)
  schedule:
    - cron: "17 4 * * *"
  # adding your own photos re-runs the test automatically
  push:
    branches: [main]
    paths:
      - "testdata/real/**"
      - "!testdata/real/README.md"

concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: write      # publishes the app's data pack as the release 'data-pack'

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      LANGS: ${{ inputs.langs || 'en,de,ja,zh-cn,zh-tw' }}
      IMAGE_LANGS: ${{ inputs.image_langs || 'en,de,ja,zh-cn,zh-tw' }}
      MODELS: ${{ inputs.models || 'phash,mnv3_art' }}
      QUERIES: ${{ inputs.queries || '1500' }}
      MAX_SETS: ${{ inputs.max_sets || '0' }}
      PRICES: ${{ github.event_name != 'workflow_dispatch' || inputs.prices }}
      PSA: ${{ github.event_name != 'workflow_dispatch' || inputs.psa }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r pipeline/requirements.txt pytest onnx onnxruntime

      - name: Self-test (offline, invented cards)
        working-directory: pipeline
        run: python -m pytest -q tests

      - name: Restore TCGdex cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/tcgdex
          key: tcgdex-${{ github.run_id }}
          restore-keys: tcgdex-

      - name: Fetch catalog, prices and images
        working-directory: pipeline
        run: |
          PRICE_FLAG=""
          if [ "$PRICES" != "true" ]; then PRICE_FLAG="--no-prices"; fi
          python -m tcgscan fetch --cache ../.cache/tcgdex --db ../out/catalog.sqlite \
            --langs "$LANGS" --image-langs "$IMAGE_LANGS" --max-sets "$MAX_SETS" $PRICE_FLAG

      # cards TCGdex has no picture for (galleries, promos ...) can't be recognised; this
      # second source fills many of them. Optional: without it they just stay unrecognisable.
      - name: Pictures for cards TCGdex has none for (pokemontcg.io)
        continue-on-error: true
        timeout-minutes: 20
        working-directory: pipeline
        run: |
          rm -rf ../.cache/ptcg-data
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/PokemonTCG/pokemon-tcg-data.git ../.cache/ptcg-data
          git -C ../.cache/ptcg-data sparse-checkout set sets cards/en
          python -m tcgscan altimages --db ../out/catalog.sqlite --cache ../.cache/tcgdex --data ../.cache/ptcg-data

      - name: Save TCGdex cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/tcgdex
          key: tcgdex-${{ github.run_id }}

      - name: Restore PSA price cache
        if: env.PSA == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/graded
          key: graded-${{ github.run_id }}
          restore-keys: graded-

      - name: PSA 10/9/8 prices (PokemonPriceTracker)
        if: env.PSA == 'true'
        # optional: never hold up or break the data pack
        timeout-minutes: 35
        continue-on-error: true
        working-directory: pipeline
        env:
          POKEMONPRICETRACKER_API_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
        run: python -m tcgscan graded --db ../out/catalog.sqlite --cache ../.cache/graded --budget 18000

      - name: Save PSA price cache
        if: always() && env.PSA == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/graded
          key: graded-${{ github.run_id }}

      - name: Restore fingerprint cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/emb
          key: emb-${{ github.run_id }}
          restore-keys: emb-

      - name: Accuracy test
        working-directory: pipeline
        run: |
          python -m tcgscan evaluate --cache ../.cache/tcgdex --db ../out/catalog.sqlite \
            --emb-cache ../.cache/emb --models "$MODELS" --queries "$QUERIES" \
            --real ../testdata/real --out ../out

      - name: Export the app's data pack
        working-directory: pipeline
        run: |
          python -m tcgscan export --cache ../.cache/tcgdex --db ../out/catalog.sqlite --emb-cache ../.cache/emb \
            --model mnv3_art --real ../testdata/real --results ../out/results.json --out ../out/app-pack

      # after the export: it adds the foil texture grids to the cache
      - name: Save fingerprint cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/emb
          key: emb-${{ github.run_id }}

      # full catalog only; the Android build downloads it from here
      - name: Publish data pack (release 'data-pack')
        if: env.MAX_SETS == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data-pack >/dev/null 2>&1 || gh release create data-pack --latest=false \
            --title "Data pack for the app" \
            --notes "Fingerprint model, card index, catalog with Cardmarket prices. Built by the Data pipeline workflow; no card images."
          gh release upload data-pack out/app-pack/* --clobber

      - name: Show report on the run page
        if: always()
        run: |
          if [ -f out/report.md ]; then
            cat out/report.md >> "$GITHUB_STEP_SUMMARY"
            echo "=====REPORT====="; cat out/report.md; echo "=====END REPORT====="   # also in the log
          fi
          if [ -f out/foil-lab.md ]; then
            cat out/foil-lab.md >> "$GITHUB_STEP_SUMMARY"
            echo "=====FOIL====="; cat out/foil-lab.md; echo "=====END FOIL====="
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            out/report.md
            out/results.json
            out/debug/
          retention-days: 14
          if-no-files-found: ignore

      # big (~200 MB): only on manual runs, kept briefly to save storage quota
      - name: Upload data pack
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: data-pack
          path: out/pack/
          retention-days: 5
