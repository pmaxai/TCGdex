name: Android 16 check (16 KB pages)

# On demand: the Google Play edition with all its tests on an Android 16 emulator that uses
# 16 KB memory pages, like new phones will. A native library that isn't aligned for them
# doesn't load there, and the app's target API 36 changes take effect only on Android 16.
# (The everyday tests in 'Android app' run the direct edition on Android 14.)

on:
  workflow_dispatch:

concurrency:
  group: android-16k
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Get the data pack and test photos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          A=android/app/src
          mkdir -p $A/main/assets/pack $A/androidTest/assets/parity $A/androidTest/assets/real
          gh release download data-pack -D $A/main/assets/pack --clobber \
            -p model.onnx -p index.f16 -p catalog.sqlite -p pack.json
          gh release download data-pack -D $A/main/assets/pack --clobber -p texture.u8 \
            || echo "this data pack has no foil texture grids yet"
          gh release download data-pack -D /tmp --clobber -p parity.zip
          unzip -o -q /tmp/parity.zip -d $A/androidTest/assets/parity
          find testdata/real -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) \
            -exec cp {} $A/androidTest/assets/real/ \;

      - name: Build the Play edition
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assemblePlayDebug assemblePlayDebugAndroidTest

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tests on Android 16 with 16 KB pages
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis_ps16k
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          working-directory: android
          script: echo "page size $(adb shell getconf PAGE_SIZE)"; ./gradlew --no-daemon connectedPlayDebugAndroidTest; s=$?; adb logcat -d -s ParityTest:I ScriptDetection:I RecordingE2E:I Account:I ZoomKept:I Templates:I GallerySaver:I Store:I PackUpdate:I Recording:W CardScanner:W AndroidRuntime:E linker:W; exit $s

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: test-reports-16k
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
