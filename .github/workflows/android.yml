name: Android app

# Builds the APK with the latest data pack, publishes it as the release
# 'app-latest' (download it on the phone), then self-tests it on an emulator.
# Next to it (job 'play'): the Google Play edition as an app bundle (.aab) for the Play Console.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  # a new data pack (prices, cards) -> a new APK: the Data pipeline starts this workflow
  # (workflow_dispatch) as soon as it has published the pack

concurrency:
  group: android
  cancel-in-progress: false   # let a running emulator test finish; the newest push waits

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Account service reachable?
        # the app's account server (gradle.properties); only a note here, the build goes on either way
        run: |
          url=$(grep '^cardscanner.accountUrl=' android/gradle.properties | cut -d= -f2-)
          for u in "$url" "${url/:\/\//://staging.}"; do
            echo "$u/api/app/v1/status (no token): $(curl -sS -m 15 -w ' HTTP %{http_code}' "$u/api/app/v1/status" 2>&1 | tail -c 300 || true)"
          done

      - name: Get the data pack and test photos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          A=android/app/src
          mkdir -p $A/main/assets/pack $A/androidTest/assets/parity $A/androidTest/assets/real
          gh release download data-pack -D $A/main/assets/pack --clobber \
            -p model.onnx -p index.f16 -p catalog.sqlite -p pack.json
          gh release download data-pack -D $A/main/assets/pack --clobber -p texture.u8 \
            || echo "this data pack has no foil texture grids yet"
          gh release download data-pack -D /tmp --clobber -p parity.zip
          unzip -o -q /tmp/parity.zip -d $A/androidTest/assets/parity
          find testdata/real -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) \
            -exec cp {} $A/androidTest/assets/real/ \;
          ls -la $A/main/assets/pack $A/androidTest/assets/real

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDirectDebug assembleDirectDebugAndroidTest

      - name: Native libraries ready for 16 KB pages?
        # a note for the APK (it installs fine on today's phones either way); the Play job enforces it
        run: |
          python3 android/tools/check_16kb.py android/app/build/outputs/apk/direct/debug/app-direct-arm64-v8a-debug.apk \
            || echo "::warning::Some native libraries of the APK aren't aligned to 16 KB pages (see above)"

      - name: Publish APK (release 'app-latest')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la android/app/build/outputs/apk/direct/debug/
          cp android/app/build/outputs/apk/direct/debug/app-direct-arm64-v8a-debug.apk CardScanner.apk
          ls -la CardScanner.apk
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --latest \
            --title "Card Scanner app" \
            --notes "Latest build. On your phone: download CardScanner.apk below and open it (allow installing from your browser once)."
          gh release upload app-latest CardScanner.apk --clobber
          # what the app's update check reads (after the APK, so it never points at a missing one)
          python3 - <<'EOF' > version.json
          import json, os, sqlite3
          from datetime import datetime, timezone
          pack = "android/app/src/main/assets/pack"
          n = int(os.environ["GITHUB_RUN_NUMBER"])
          # the same name as build.gradle.kts gives the app: <line>.<builds since the line started>
          props = dict(l.split("=", 1) for l in open("android/version.properties", encoding="utf-8").read().splitlines()
                       if "=" in l and not l.lstrip().startswith("#"))
          name = f"{props['line'].strip()}.{max(0, n - int(props['base'].strip()))}"
          con = sqlite3.connect(f"{pack}/catalog.sqlite")
          prices = con.execute("SELECT MAX(updated) FROM prices").fetchone()[0]
          print(json.dumps({
              "versionCode": n, "versionName": name,
              "built": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "pack": json.load(open(f"{pack}/pack.json"))["version"], "prices": prices,
              "apk": "CardScanner.apk"}, indent=1))
          EOF
          cat version.json
          gh release upload app-latest version.json --clobber

      - uses: actions/upload-artifact@v4
        continue-on-error: true      # a hiccup of GitHub's artifact store doesn't fail a good build
        with:
          name: apk
          path: CardScanner.apk
          retention-days: 7

      - name: MinIO for the S3 upload test (recordings)
        continue-on-error: true      # without it the test is skipped, nothing else depends on it
        run: |
          # MinIO's images left Docker Hub: try the registries that still have one
          for img in quay.io/minio/minio cgr.dev/chainguard/minio bitnami/minio; do
            docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
              "$img" server /data && { echo "MinIO from $img"; break; }
            docker rm -f minio >/dev/null 2>&1 || true
          done
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 2; done
          curl -sSf --aws-sigv4 "aws:amz:us-east-1:s3" --user minioadmin:minioadmin -X PUT http://localhost:9000/recordings-test
          # the emulator reaches this computer as 10.0.2.2
          echo "S3_TEST_ENDPOINT=http://10.0.2.2:9000" >> "$GITHUB_ENV"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Self-test on an emulator (app vs. pipeline)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # the staging shop's key for the Webshop test (repository secrets; without them that test is skipped)
          POKESHOP_STAGING_KEY_ID: ${{ secrets.POKESHOP_STAGING_KEY_ID }}
          POKESHOP_STAGING_SECRET: ${{ secrets.POKESHOP_STAGING_SECRET }}
          # a device token of a test subscription on staging.overpricedcardboard.com (optional; without it that test is skipped)
          ACCOUNT_STAGING_TOKEN: ${{ secrets.ACCOUNT_STAGING_TOKEN }}
          # the staging server's access header for the store tests (from the shop team; without it they are skipped)
          ACCOUNT_STAGING_ACCESS: ${{ secrets.ACCOUNT_STAGING_ACCESS }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon connectedDirectDebugAndroidTest; s=$?; adb logcat -d -s ParityTest:I ScriptDetection:I ShopStaging:I RecordingE2E:I Account:I ZoomKept:I Templates:I GallerySaver:I Store:I PackUpdate:I Recording:W CardScanner:W AndroidRuntime:E; exit $s

      - uses: actions/upload-artifact@v4
        continue-on-error: true      # a hiccup of GitHub's artifact store doesn't fail a good build
        if: always()
        with:
          name: test-reports
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        continue-on-error: true      # a hiccup of GitHub's artifact store doesn't fail a good build
        if: always()
        with:
          name: screenshots
          path: android/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: ignore

      - name: Screenshots in the log (readable where artifacts are not)
        if: always()
        run: |
          find android/app/build/outputs/connected_android_test_additional_output -name '*.png' 2>/dev/null | sort | while read -r f; do
            echo "::group::$(basename "$f")"
            echo "SHOT-BEGIN $(basename "$f")"; base64 "$f"; echo "SHOT-END"
            echo "::endgroup::"
          done

  play:
    # The Google Play edition (app ID com.overpricedcardboard.app): the same app without the
    # self-update, as a bundle for the Play Console (workflow artifact 'play-bundle-<run>').
    # Signed with the upload key from the secrets PLAY_UPLOAD_KEYSTORE_BASE64 (the keystore file,
    # base64), PLAY_UPLOAD_KEYSTORE_PASSWORD, PLAY_UPLOAD_KEY_ALIAS, PLAY_UPLOAD_KEY_PASSWORD;
    # without them it is built unsigned (fine for the checks, not for Play).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Get the data pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          P=android/app/src/main/assets/pack
          mkdir -p $P
          gh release download data-pack -D $P --clobber -p model.onnx -p index.f16 -p catalog.sqlite -p pack.json
          gh release download data-pack -D $P --clobber -p texture.u8 || echo "this data pack has no foil texture grids yet"

      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "PLAY_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signing with the upload key"
          else
            echo "::notice::No upload key in the secrets yet: the Play bundle is built unsigned (the Play Console won't take it)"
          fi

      - name: Build the Play bundle
        working-directory: android
        env:
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace bundlePlayRelease

      - name: Check the bundle (what Play checks on upload)
        run: |
          aab=android/app/build/outputs/bundle/playRelease/app-play-release.aab
          ls -la "$aab"
          python3 android/tools/check_16kb.py "$aab"
          # the manifest (protobuf; its strings are readable as they are)
          m=$(unzip -p "$aab" base/manifest/AndroidManifest.xml | strings -n 6)
          echo "$m" | grep -q 'com\.overpricedcardboard\.app' || { echo "::error::the app ID isn't com.overpricedcardboard.app"; exit 1; }
          if echo "$m" | grep -q 'REQUEST_INSTALL_PACKAGES'; then echo "::error::the Play bundle asks for REQUEST_INSTALL_PACKAGES"; exit 1; fi
          echo "permissions:"; echo "$m" | grep -oE 'android\.permission\.[A-Z_]+' | sort -u | sed 's/^/  /'
          if unzip -l "$aab" | grep -E ' base/lib/(armeabi-v7a|x86)/'; then echo "::error::32-bit libraries in the bundle"; exit 1; fi
          echo "processor types: $(unzip -l "$aab" | grep -oE 'base/lib/[^/]+/' | sort -u | cut -d/ -f3 | tr '\n' ' ')"
          if unzip -l "$aab" | grep -qE 'META-INF/[^/]+\.(RSA|EC|DSA)$'; then echo "signed with the upload key"; else echo "::notice::unsigned bundle"; fi

      - uses: actions/upload-artifact@v4
        continue-on-error: true      # a hiccup of GitHub's artifact store doesn't fail a good build
        with:
          name: play-bundle-${{ github.run_number }}
          path: android/app/build/outputs/bundle/playRelease/app-play-release.aab
          retention-days: 14
