name: Android app

# Builds the APK with the latest data pack, publishes it as the release
# 'app-latest' (download it on the phone), then self-tests it on an emulator.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  # a new data pack (prices, cards) -> a new APK: the Data pipeline starts this workflow
  # (workflow_dispatch) as soon as it has published the pack

concurrency:
  group: android
  cancel-in-progress: false   # let a running emulator test finish; the newest push waits

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: License service reachable?
        # the app asks the service in gradle.properties; only a note here, the build goes on either way
        run: |
          if grep -q '^cardscanner.licenceRequired=true' android/gradle.properties; then
            url=$(grep '^cardscanner.licenceUrl=' android/gradle.properties | cut -d= -f2-)
            for u in "$url" "${url/license./license.staging.}"; do
              echo "$u/health: $(curl -sS -m 15 "$u/health" 2>&1 || true)"
            done
          else
            echo "licence check is off in this build"
          fi

      - name: Get the data pack and test photos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          A=android/app/src
          mkdir -p $A/main/assets/pack $A/androidTest/assets/parity $A/androidTest/assets/real
          gh release download data-pack -D $A/main/assets/pack --clobber \
            -p model.onnx -p index.f16 -p catalog.sqlite -p pack.json
          gh release download data-pack -D $A/main/assets/pack --clobber -p texture.u8 \
            || echo "this data pack has no foil texture grids yet"
          gh release download data-pack -D /tmp --clobber -p parity.zip
          unzip -o -q /tmp/parity.zip -d $A/androidTest/assets/parity
          find testdata/real -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) \
            -exec cp {} $A/androidTest/assets/real/ \;
          ls -la $A/main/assets/pack $A/androidTest/assets/real

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest

      - name: Publish APK (release 'app-latest')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la android/app/build/outputs/apk/debug/
          cp android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk CardScanner.apk
          ls -la CardScanner.apk
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --latest \
            --title "Card Scanner app" \
            --notes "Latest build. On your phone: download CardScanner.apk below and open it (allow installing from your browser once)."
          gh release upload app-latest CardScanner.apk --clobber
          # what the app's update check reads (after the APK, so it never points at a missing one)
          python3 - <<'EOF' > version.json
          import json, os, sqlite3
          from datetime import datetime, timezone
          pack = "android/app/src/main/assets/pack"
          n = int(os.environ["GITHUB_RUN_NUMBER"])
          # the same name as build.gradle.kts gives the app: <line>.<builds since the line started>
          props = dict(l.split("=", 1) for l in open("android/version.properties", encoding="utf-8").read().splitlines()
                       if "=" in l and not l.lstrip().startswith("#"))
          name = f"{props['line'].strip()}.{max(0, n - int(props['base'].strip()))}"
          con = sqlite3.connect(f"{pack}/catalog.sqlite")
          prices = con.execute("SELECT MAX(updated) FROM prices").fetchone()[0]
          print(json.dumps({
              "versionCode": n, "versionName": name,
              "built": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "pack": json.load(open(f"{pack}/pack.json"))["version"], "prices": prices,
              "apk": "CardScanner.apk"}, indent=1))
          EOF
          cat version.json
          gh release upload app-latest version.json --clobber

      - uses: actions/upload-artifact@v4
        continue-on-error: true      # a hiccup of GitHub's artifact store doesn't fail a good build
        with:
          name: apk
          path: CardScanner.apk
          retention-days: 7

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Self-test on an emulator (app vs. pipeline)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # the staging shop's key for the Webshop test (repository secrets; without them that test is skipped)
          POKESHOP_STAGING_KEY_ID: ${{ secrets.POKESHOP_STAGING_KEY_ID }}
          POKESHOP_STAGING_SECRET: ${{ secrets.POKESHOP_STAGING_SECRET }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest; s=$?; adb logcat -d -s ParityTest:I ShopStaging:I CardScanner:W AndroidRuntime:E; exit $s

      - uses: actions/upload-artifact@v4
        continue-on-error: true      # a hiccup of GitHub's artifact store doesn't fail a good build
        if: always()
        with:
          name: test-reports
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        continue-on-error: true      # a hiccup of GitHub's artifact store doesn't fail a good build
        if: always()
        with:
          name: screenshots
          path: android/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: ignore

      - name: Screenshots in the log (readable where artifacts are not)
        if: always()
        run: |
          find android/app/build/outputs/connected_android_test_additional_output -name '*.png' 2>/dev/null | sort | while read -r f; do
            echo "::group::$(basename "$f")"
            echo "SHOT-BEGIN $(basename "$f")"; base64 "$f"; echo "SHOT-END"
            echo "::endgroup::"
          done
