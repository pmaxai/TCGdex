# The Xcode project, generated by XcodeGen (`xcodegen generate` in this folder; see README.md).
name: OverpricedCardboard
options:
  bundleIdPrefix: com.overpricedcardboard
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_CXX_LIBRARY: libc++
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_BITCODE: NO
    # the OpenCV build has arm64 only (every iPhone and Apple-silicon simulator)
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    # set when the Apple developer account is ready (the team ID from developer.apple.com)
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  OverpricedCardboard:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Bridge
      - path: CardCore/src
      - path: CardCore/include
        buildPhase: none
      - path: Resources
      # the data pack (model, index, catalog): downloaded from the release 'data-pack' (CI does it)
      - path: pack
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - framework: Vendor/opencv2.xcframework
        embed: false
      # ONNX Runtime (a static framework from Microsoft's download server; CI puts it here)
      - framework: Vendor/onnxruntime.xcframework
        embed: false
      - sdk: CoreML.framework
      - sdk: Accelerate.framework
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Overpriced Cardboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSCameraUsageDescription: The camera recognises your cards and shows their prices.
        ITSAppUsesNonExemptEncryption: false
        # the account server (sign-in, subscription, nightly prices)
        AccountURL: https://overpricedcardboard.com
        # the nightly data pack, downloaded in the background
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [com.overpricedcardboard.app.pack]
    entitlements:
      path: Generated/OverpricedCardboard.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.overpricedcardboard.app
        PRODUCT_NAME: OverpricedCardboard
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Bridge/OverpricedCardboard-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/CardCore/include $(SRCROOT)/Vendor/onnxruntime-headers
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GCC_WARN_INHIBIT_ALL_WARNINGS: NO
        OTHER_LDFLAGS: -lc++

  OverpricedCardboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: ["Fixtures/**"]
      # the pipeline's comparison photos (parity.zip) and testdata/real (CI puts them here)
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
        optional: true
      # stand-in App Store products for StoreKitTest
      - path: StoreKit/OverpricedCardboard.storekit
        buildPhase: resources
    dependencies:
      - target: OverpricedCardboard
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.overpricedcardboard.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Bridge/OverpricedCardboard-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/CardCore/include

schemes:
  OverpricedCardboard:
    build:
      targets:
        OverpricedCardboard: all
        OverpricedCardboardTests: [test]
    run:
      config: Debug
      # purchases in Xcode without the App Store (stand-in products)
      storeKitConfiguration: StoreKit/OverpricedCardboard.storekit
    test:
      config: Debug
      targets:
        - OverpricedCardboardTests
    archive:
      config: Release
