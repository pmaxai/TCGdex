# The app's version: <line>.<n>, n = the number of builds since this line started
# (1.2.1, 1.2.2, ...). A release (Actions -> Restore point with "latest") moves to the next
# line by itself (restore-point.yml writes this file). Android's hidden versionCode keeps
# counting all builds, so every build installs over the one before.
line=1.2
# the last Android build (run number) before this line: v1.1.6 was build 55 (1.1.55)
base=55
